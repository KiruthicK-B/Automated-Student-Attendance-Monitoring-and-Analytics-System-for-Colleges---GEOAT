name: geoat_back
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.7.0


dependencies:
  flutter:
    sdk: flutter

  
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  geolocator: ^13.0.4
  intl: ^0.20.2
  google_maps_flutter: ^2.12.1
  google_maps_flutter_platform_interface: ^2.11.1
  geocoding: ^3.0.0
  connectivity_plus: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Splash3.png"
flutter_launcher_name:
  name: "GeoAt"

flutter:
  assets:
    - assets/logo.png
    - assets/onboarding_image.png
    - assets/geoat_earth.png
    - assets/Splash.png
    - assets/Splash2.png
    - assets/Splash3.png
    - assets/Splash3.jpg
    - assets/profile.jpeg
    - assets/employee.png

  uses-material-design: true  # Enables Material Design in the app
